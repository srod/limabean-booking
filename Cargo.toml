[package]
name = "ledgermill-beancount-booking"
version = "0.10.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Beancount booking algorithms: a fork of limabean-booking that depends on ledgermill-beancount-parser, published for ledgermill"
homepage = "https://github.com/srod/limabean-booking"
repository = "https://github.com/srod/limabean-booking"
readme = "README.md"

# Keep the upstream crate name in code, so the fork differs from upstream only here.
[lib]
name = "limabean_booking"

[dependencies]
beancount-parser-lima = { package = "ledgermill-beancount-parser", git = "https://github.com/srod/beancount-parser-lima", rev = "266980b6149d7d229c45b181141321f588ec2c5b", version = "0.16.3", optional = true }
rust_decimal = { version = "1.37", optional = true }
hashbrown = { version = "0.15" }
strum_macros = { version = "0.27" }
time = { version = "0.3" }
tracing = { version = "0.1" }

[dev-dependencies]
beancount-parser-lima = { package = "ledgermill-beancount-parser", git = "https://github.com/srod/beancount-parser-lima", rev = "266980b6149d7d229c45b181141321f588ec2c5b", version = "0.16.3" }
rstest = { version = "0.26" }
rust_decimal_macros = { version = "1.37" }
time = { version = "0.3", features = ["macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["lima-parser-types", "rust-decimal"]
rust-decimal = ["dep:rust_decimal"]
lima-parser-types = ["dep:beancount-parser-lima", "dep:rust_decimal"]
